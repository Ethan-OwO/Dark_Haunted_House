name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JavaFX SDK
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-sdk.zip"
          Invoke-WebRequest -Uri $url -OutFile javafx-sdk.zip
          Expand-Archive javafx-sdk.zip -DestinationPath .
          echo "JAVAFX_HOME=${{ github.workspace }}\javafx-sdk-21.0.2" >> $env:GITHUB_ENV

      - name: Download JavaFX jmods
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/21.0.2/openjfx-21.0.2_windows-x64_bin-jmods.zip"
          Invoke-WebRequest -Uri $url -OutFile javafx-jmods.zip
          Expand-Archive javafx-jmods.zip -DestinationPath .
          echo "JAVAFX_JMODS=${{ github.workspace }}\javafx-jmods-21.0.2" >> $env:GITHUB_ENV

      - name: Build JAR
        run: mvn --batch-mode package -DskipTests

      - name: Create runtime image with jlink
        shell: pwsh
        run: |
          jlink `
            --module-path "$env:JAVA_HOME\jmods;$env:JAVAFX_JMODS" `
            --add-modules java.base,java.desktop,java.logging,javafx.controls,javafx.media,javafx.graphics `
            --output runtime `
            --strip-debug `
            --no-man-pages `
            --no-header-files `
            --compress=2

      - name: Package app-image with jpackage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          jpackage `
            --type app-image `
            --name "逃離中央大學" `
            --app-version "1.0.0" `
            --runtime-image runtime `
            --input target `
            --main-jar escape-ncu-1.0-SNAPSHOT.jar `
            --main-class com.escapencu.Main `
            --dest dist

      - name: Zip app-image for release
        shell: pwsh
        run: |
          Get-ChildItem dist
          $appDir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          Compress-Archive -Path $appDir.FullName -DestinationPath "dist\EscapeNCU-windows.zip"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "逃離中央大學 ${{ github.ref_name }}"
          body: |
            ## 下載說明
            1. 下載 `逃離中央大學-v1.0-windows.zip`
            2. 解壓縮到任意資料夾
            3. 雙擊資料夾內的 `逃離中央大學.exe` 即可遊玩（不需安裝 Java）

            如出現 Windows Defender 警告：點「更多資訊」→「仍要執行」
          files: dist/EscapeNCU-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
